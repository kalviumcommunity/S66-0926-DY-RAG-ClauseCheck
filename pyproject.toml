[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clausecheck"
requires-python = ">=3.11"
dynamic = ["version"]

[tool.setuptools.dynamic]
version = { attr = "clausecheck.__version__" }

[tool.setuptools.packages.find]
include = ["clausecheck*"]

[tool.setuptools.package-data]
clausecheck = ["prompts/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Test files from the PR briefs are kept verbatim
"tests/unit/test_repo_layout.py" = ["E501", "E741"]
"tests/unit/test_fetch_sources.py" = ["E501"]
"tests/unit/test_manifest.py" = ["E501", "E731"]
"tests/unit/test_synthetic.py" = ["E501", "E741"]
"tests/fixtures/make_fixtures.py" = ["E501"]
"tests/helpers.py" = ["E501"]
"tests/integration/test_ingest.py" = ["E501"]
"tests/unit/test_chunker.py" = ["E501", "B905"]
"tests/unit/test_sqlite.py" = ["E501"]
"tests/unit/test_eval_metrics.py" = ["E501"]
"tests/unit/test_eval_set.py" = ["E501"]
"tests/unit/test_run_eval.py" = ["E501"]
"tests/unit/test_vector_retriever.py" = ["E501"]
"tests/unit/test_bm25.py" = ["E501"]
"tests/unit/test_ablation.py" = ["E741"]
"tests/unit/test_judge.py" = ["E501"]
"tests/integration/test_query_service.py" = ["E501"]
"tests/unit/test_cache.py" = ["E501"]
"tests/unit/test_query_log.py" = ["E501"]
"tests/unit/test_rewriter.py" = ["E501"]
"tests/unit/test_sessions.py" = ["E501"]
"tests/unit/test_answer_metrics.py" = ["E501"]
"tests/unit/test_citation_validator.py" = ["E501"]
"tests/unit/test_context_builder.py" = ["E501"]
"tests/unit/test_relevance_gate.py" = ["E501"]
"tests/unit/test_prompts.py" = ["E501"]
"tests/unit/test_generator.py" = ["E501"]
"tests/integration/test_hybrid_retrieval.py" = ["E501"]

[tool.black]
line-length = 100
# Test files from the PR briefs are kept verbatim
extend-exclude = "tests/(conftest|helpers|fixtures/make_fixtures|integration/test_(ingest|hybrid_retrieval|query_service)|unit/test_(smoke|repo_layout|env_example|schema|fetch_sources|synthetic|manifest|chunker|sqlite|eval_metrics|eval_set|run_eval|vector_retriever|bm25|reranker|ablation|prompts|generator|context_builder|relevance_gate|citation_validator|answer_metrics|cache|query_log|rewriter|sessions|judge))\\.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "e2e: needs a running deployment (skipped unless CLAUSECHECK_E2E=1)",
    "targets: corpus size targets",
    "slow: downloads models",
]
